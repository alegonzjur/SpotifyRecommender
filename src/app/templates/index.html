<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotifyMusicRecommender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Circular+Std:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- ── Hero ── -->
  <header class="hero">
    <div class="hero__inner">
      <div class="hero__badge">
        <span class="dot"></span> 113.422 canciones
      </div>
      <h1 class="hero__title">
        Spotify<span class="accent">Music</span>Recommender
      </h1>
      <p class="hero__subtitle">
        Descubre canciones similares a las que ya te gustan.<br />
        Basado en análisis de audio features y clustering K-Means.
      </p>
    </div>
  </header>

  <!-- ── Formulario ── -->
  <main class="main">
    <section class="search-section">
      <form class="search-form" id="searchForm">

        <div class="form-row">
          <div class="form-group form-group--wide">
            <label for="titulo">Título de la canción <span class="required">*</span></label>
            <input
              type="text"
              id="titulo"
              placeholder="Ej: Blinding Lights"
              autocomplete="off"
              required
            />
          </div>

          <div class="form-group">
            <label for="artista">Artista <span class="optional">(opcional)</span></label>
            <input
              type="text"
              id="artista"
              placeholder="Ej: The Weeknd"
              autocomplete="off"
            />
          </div>

          <div class="form-group form-group--narrow">
            <label for="n">Recomendaciones</label>
            <select id="n">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="15">15</option>
              <option value="20">20</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-search" id="btnSearch">
          <span class="btn-text">Buscar canciones similares</span>
          <span class="btn-loader" hidden>
            <span class="spinner"></span> Buscando...
          </span>
        </button>

      </form>
    </section>

    <!-- ── Resultados ── -->
    <section class="results-section" id="resultsSection" hidden>

      <div class="reference-card" id="referenceCard">
        <p class="reference-label">Canción de referencia</p>
        <h2 class="reference-title" id="refTitle"></h2>
        <p class="reference-meta" id="refMeta"></p>
        <div class="reference-tags" id="refTags"></div>
      </div>

      <div class="results-header">
        <h3 class="results-title" id="resultsTitle"></h3>
      </div>

      <div class="cards-grid" id="cardsGrid"></div>

    </section>

    <!-- ── Error ── -->
    <div class="error-box" id="errorBox" hidden>
      <span class="error-icon">⚠</span>
      <p id="errorMsg"></p>
    </div>

  </main>

  <!-- ── Footer ── -->
  <footer class="footer">
    <p>
      SpotifyMusicRecommender ·
      <a href="https://github.com/alegonzjur" target="_blank">@alegonzjur</a>
    </p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
